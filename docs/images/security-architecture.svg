<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 420" width="980" height="420" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="secGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#60a5fa"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f87171"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#fbbf24"/>
    </marker>
  </defs>

  <rect width="980" height="420" rx="14" fill="url(#bgGrad)"/>

  <!-- Title -->
  <text x="32" y="38" fill="#f8fafc" font-size="18" font-weight="700">SEG3502 Lab 9 — Stateless HTTP Basic Security Architecture</text>
  <text x="32" y="58" fill="#94a3b8" font-size="12">Spring Boot 3.3.1 · Kotlin 1.9.24 · Spring Security 6 · Java 21 · OpenAPI / Swagger UI</text>

  <!-- Client Box -->
  <rect x="32" y="130" width="170" height="145" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <text x="117" y="156" text-anchor="middle" fill="#e2e8f0" font-size="14" font-weight="700">HTTP Client</text>
  <text x="117" y="178" text-anchor="middle" fill="#94a3b8" font-size="11">curl / Browser / Swagger UI</text>
  <rect x="48" y="194" width="138" height="28" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="117" y="212" text-anchor="middle" fill="#38bdf8" font-size="11" font-family="monospace">Authorization: Basic</text>
  <rect x="48" y="230" width="138" height="28" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="117" y="248" text-anchor="middle" fill="#cbd5e1" font-size="10.5" font-family="monospace">GET /temperature-converter/...</text>

  <!-- Arrow Client -> FilterChain -->
  <line x1="202" y1="185" x2="262" y2="185" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="232" y="176" text-anchor="middle" fill="#93c5fd" font-size="10">HTTP</text>

  <!-- SecurityFilterChain Box -->
  <rect x="266" y="92" width="290" height="218" rx="12" fill="#0f172a" stroke="#3b82f6" stroke-width="2"/>
  <rect x="266" y="92" width="290" height="36" rx="12" fill="url(#secGrad)"/>
  <text x="411" y="115" text-anchor="middle" fill="#ffffff" font-size="13.5" font-weight="700">SecurityFilterChain (SecurityConfig.kt)</text>

  <rect x="282" y="140" width="258" height="34" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="294" y="161" fill="#e2e8f0" font-size="11.5">1. CSRF Disabled · Session: <tspan fill="#38bdf8" font-family="monospace">STATELESS</tspan></text>

  <rect x="282" y="182" width="258" height="34" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="294" y="203" fill="#e2e8f0" font-size="11.5">2. <tspan fill="#38bdf8" font-family="monospace">httpBasic()</tspan> Header Extraction</text>

  <rect x="282" y="224" width="258" height="34" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="294" y="245" fill="#e2e8f0" font-size="11.5">3. <tspan fill="#38bdf8" font-family="monospace">anyRequest().authenticated()</tspan></text>

  <text x="411" y="294" text-anchor="middle" fill="#94a3b8" font-size="10.5">All endpoints including /swagger-ui.html protected</text>

  <!-- InMemoryUserDetailsManager Box -->
  <rect x="296" y="334" width="230" height="66" rx="10" fill="#1e293b" stroke="#6366f1" stroke-width="1.5"/>
  <text x="411" y="356" text-anchor="middle" fill="#c7d2fe" font-size="12" font-weight="700">InMemoryUserDetailsManager</text>
  <text x="411" y="374" text-anchor="middle" fill="#94a3b8" font-size="10.5">DelegatingPasswordEncoder (bcrypt)</text>
  <text x="411" y="390" text-anchor="middle" fill="#cbd5e1" font-size="10.5" font-family="monospace">user1 (USER) · user2 (USER)</text>

  <!-- Bidirectional check FilterChain <-> UserDetailsService -->
  <line x1="411" y1="310" x2="411" y2="332" stroke="#60a5fa" stroke-width="1.8" marker-end="url(#arrowBlue)"/>

  <!-- 401 Return Arrow -->
  <path d="M 266 238 L 234 238 L 234 252 L 204 252" fill="none" stroke="#f87171" stroke-width="2" marker-end="url(#arrowRed)"/>
  <rect x="195" y="272" width="102" height="36" rx="6" fill="#450a0a" stroke="#ef4444" stroke-width="1"/>
  <text x="246" y="288" text-anchor="middle" fill="#fecaca" font-size="11" font-weight="700">401 Unauthorized</text>
  <text x="246" y="302" text-anchor="middle" fill="#fca5a5" font-size="9.5">No / Invalid Creds</text>

  <!-- Arrow FilterChain -> Controller -->
  <line x1="556" y1="185" x2="626" y2="185" stroke="#34d399" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="591" y="176" text-anchor="middle" fill="#6ee7b7" font-size="10">Authenticated</text>

  <!-- ConverterController Box -->
  <rect x="630" y="92" width="318" height="145" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
  <text x="789" y="118" text-anchor="middle" fill="#6ee7b7" font-size="13.5" font-weight="700">ConverterController</text>
  <text x="789" y="136" text-anchor="middle" fill="#94a3b8" font-size="11">@RequestMapping("temperature-converter")</text>

  <rect x="646" y="148" width="286" height="32" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="656" y="168" fill="#cbd5e1" font-size="10.5" font-family="monospace">GET /celsius-fahrenheit/{c} → 200 OK</text>

  <rect x="646" y="188" width="286" height="32" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="656" y="208" fill="#cbd5e1" font-size="10.5" font-family="monospace">GET /fahrenheit-celsius/{f} → 200 OK</text>

  <!-- ControllerExceptionHandler Box -->
  <rect x="630" y="264" width="318" height="90" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="789" y="288" text-anchor="middle" fill="#fcd34d" font-size="13" font-weight="700">ControllerExceptionHandler</text>
  <text x="789" y="306" text-anchor="middle" fill="#94a3b8" font-size="11">@RestControllerAdvice · Non-numeric input</text>
  <rect x="646" y="316" width="286" height="26" rx="6" fill="#451a03" stroke="#d97706"/>
  <text x="789" y="333" text-anchor="middle" fill="#fde68a" font-size="10.5" font-family="monospace">400 Bad Request: "Unable to process request"</text>

  <line x1="789" y1="237" x2="789" y2="262" stroke="#fbbf24" stroke-width="1.8" stroke-dasharray="4,3" marker-end="url(#arrowAmber)"/>
</svg>
